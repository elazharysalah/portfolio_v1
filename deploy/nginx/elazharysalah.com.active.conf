# Bootstrap config (HTTP only) — use this first to obtain SSL certificates.
# After certbot succeeds, switch to elazharysalah.com.conf

upstream portfolio_app {
  server app:3000;
  keepalive 32;
}

server {
  listen 80;
  listen [::]:80;
  server_name elazharysalah.com www.elazharysalah.com;

  client_max_body_size 25m;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    proxy_pass http://portfolio_app;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }
}
