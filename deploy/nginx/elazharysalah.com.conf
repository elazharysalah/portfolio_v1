upstream portfolio_app {
  server app:3000;
  keepalive 32;
}

server {
  listen 80;
  listen [::]:80;
  server_name elazharysalah.com www.elazharysalah.com;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://elazharysalah.com$request_uri;
  }
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name www.elazharysalah.com;

  ssl_certificate     /etc/letsencrypt/live/elazharysalah.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/elazharysalah.com/privkey.pem;

  return 301 https://elazharysalah.com$request_uri;
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name elazharysalah.com;

  ssl_certificate     /etc/letsencrypt/live/elazharysalah.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/elazharysalah.com/privkey.pem;

  ssl_session_timeout 1d;
  ssl_session_cache shared:SSL:10m;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;

  add_header X-Frame-Options SAMEORIGIN always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  client_max_body_size 25m;

  location /_next/static/ {
    proxy_pass http://portfolio_app;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    expires 365d;
    add_header Cache-Control "public, immutable";
  }

  location /uploads/ {
    proxy_pass http://portfolio_app;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    expires 30d;
    add_header Cache-Control "public";
  }

  location / {
    proxy_pass http://portfolio_app;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 60s;
  }
}
